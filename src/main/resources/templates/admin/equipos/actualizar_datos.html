<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Actualizar equipo</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Actualizar equipo</h1>

        <h2>Datos actuales</h2>

        <p>
            <strong>ID:</strong>
            <span th:text="${equipo.id}"></span>
        </p>

        <p>
            <strong>Nombre actual:</strong>
            <span th:text="${equipo.nombre}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <h2>Editar datos</h2>

        <form th:action="@{/admin/equipos/{id}/editar(id=${equipo.id})}"
              th:object="${equipo}"
              method="post"
              onsubmit="return confirm('¿Seguro que querés actualizar los datos de este equipo?');">

            <div class="form-group">

                <label for="nombre">
                    Nuevo nombre
                </label>

                <input
                        id="nombre"
                        type="text"
                        th:field="*{nombre}"
                        required>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar cambios
                </button>

                <a th:href="@{/admin/equipos}"
                   class="btn btn-secondary">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
