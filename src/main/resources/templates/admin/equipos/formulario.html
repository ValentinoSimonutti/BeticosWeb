<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo equipo</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Crear equipo</h1>

        <form th:action="@{/admin/equipos}"
              th:object="${equipo}"
              method="post">

            <div class="form-group">

                <label for="nombre">
                    Nombre del equipo
                </label>

                <input
                        id="nombre"
                        type="text"
                        th:field="*{nombre}"
                        required>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">

                    Guardar

                </button>

                <a
                        th:href="@{/admin/equipos}"
                        class="btn btn-warning">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
