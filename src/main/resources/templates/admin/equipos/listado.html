<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
</head>
<body>

<h1>Equipos</h1>

<a href="/admin/equipos/nuevo">Crear nuevo equipo</a>

<hr>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Eliminado</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="equipo : ${equipos}">
        <td th:text="${equipo.id}"></td>
        <td th:text="${equipo.nombre}"></td>
        <td th:text="${equipo.eliminado}"></td>
        <td>
            <a th:href="@{/admin/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
            <form th:action="@{/admin/equipos/{id}/borrar(id=${equipo.id})}" method="post"
                  onsubmit="return confirm('¿Seguro que querés borrar este equipo?');">
                  <button type="submit" >Borrar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
