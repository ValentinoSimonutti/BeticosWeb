<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Equipos</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Equipos</h1>

        <a th:href="@{/admin/equipos/nuevo}"
           class="btn btn-primary">
            Crear nuevo equipo
        </a>

    </div>

    <div class="card mt-20">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="equipo : ${equipos}">

                <td th:text="${equipo.id}"></td>

                <td th:text="${equipo.nombre}"></td>

                <td class="actions">

                    <a th:href="@{/admin/equipos/{id}/editar(id=${equipo.id})}"
                       class="btn btn-warning">
                        Editar
                    </a>

                    <form th:action="@{/admin/equipos/{id}/borrar(id=${equipo.id})}"
                          method="post"
                          onsubmit="return confirm('¿Seguro que querés borrar este equipo?');">

                        <button type="submit"
                                class="btn btn-danger">

                            Borrar

                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

        <div class="actions mt-20">
            <a th:href="@{/admin/home}"
               class="btn btn-secondary">
                Volver al inicio
            </a>
        </div>

    </div>

</div>

</body>

</html>
