<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Actualizar fecha</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="~{admin/fragments/header :: header}"></div>

<div class="container">

    <div class="card">

        <h1>Actualizar fecha</h1>

        <p class="mb-20">
            <strong>Torneo:</strong>
            <span th:text="${torneo.nombre}"></span>
        </p>

        <h2>Datos actuales</h2>

        <p>
            <strong>ID:</strong>
            <span th:text="${fecha.id}"></span>
        </p>

        <p>
            <strong>Número actual:</strong>
            <span th:text="${fecha.numero}"></span>
        </p>

        <p>
            <strong>Día actual:</strong>
            <span th:text="${fecha.dia}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <h2>Editar datos</h2>

        <form th:action="@{/admin/torneos/{torneoId}/fechas/{fechaId}/editar(torneoId=${torneo.id}, fechaId=${fecha.id})}"
              th:object="${fecha}"
              method="post"
              onsubmit="return confirm('Seguro que querés actualizar esta fecha?');">

            <div class="form-group">

                <label for="numero">
                    Número
                </label>

                <input
                        id="numero"
                        type="number"
                        th:field="*{numero}"
                        min="1"
                        required>

            </div>

            <div class="form-group">

                <label for="dia">
                    Día
                </label>

                <input
                        id="dia"
                        type="date"
                        th:field="*{dia}">

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar cambios
                </button>

                <a th:href="@{/admin/torneos/{torneoId}/fechas(torneoId=${torneo.id})}"
                   class="btn btn-secondary">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

<div th:replace="~{admin/fragments/footer :: footer}"></div>

</body>

</html>
