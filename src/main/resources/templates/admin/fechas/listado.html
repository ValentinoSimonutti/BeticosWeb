<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Fechas</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Fechas</h1>

        <p class="mb-20">
            <strong>Torneo:</strong>
            <span th:text="${torneo.nombre}"></span>
        </p>

        <a th:href="@{/admin/torneos/{torneoId}/fechas/nueva(torneoId=${torneo.id})}"
           class="btn btn-primary">
            Crear nueva fecha
        </a>

    </div>

    <div class="card mt-20">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Número</th>
                <th>Día</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="fecha : ${fechas}">
                <td th:text="${fecha.id}"></td>
                <td th:text="${fecha.numero}"></td>
                <td th:text="${fecha.dia}"></td>
                <td class="actions">
                    <a th:href="@{/admin/torneos/{torneoId}/fechas/{fechaId}/editar(torneoId=${torneo.id}, fechaId=${fecha.id})}"
                       class="btn btn-warning">
                        Editar
                    </a>

                    <a th:href="@{/admin/fechas/{id}/partidos(id=${fecha.id})}"
                       class="btn btn-primary">
                        Partidos
                    </a>

                    <form th:action="@{/admin/torneos/{torneoId}/fechas/{fechaId}/borrar(torneoId=${torneo.id}, fechaId=${fecha.id})}"
                          method="post"
                          onsubmit="return confirm('Seguro que querés borrar esta fecha?');">
                        <button
                                type="submit"
                                class="btn btn-danger">
                            Borrar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="actions mt-20">
            <a th:href="@{/admin/torneos}"
               class="btn btn-secondary">
                Volver a torneos
            </a>
        </div>

    </div>

</div>

</body>

</html>
