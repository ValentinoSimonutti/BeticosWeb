<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Panel de administración</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

    <link rel="stylesheet" th:href="@{/css/home.css}">

</head>

<body>

<main class="container admin-home">

    <section class="card home-hero">

        <div class="home-brand">

            <img th:src="@{/img/escudo-beticos.png}"
                 alt="Escudo de Béticos"
                 class="home-crest">

            <div>
                <p class="home-kicker">Panel de administración</p>
                <h1>Béticos</h1>
                <p class="home-description">
                    Intento de jugar al fulbo
                </p>
            </div>

        </div>

        <div class="actions home-actions">

            <a th:href="@{/admin/equipos}"
               class="btn btn-primary">
                Equipos
            </a>

            <a th:href="@{/admin/jugadores}"
               class="btn btn-primary">
                Jugadores
            </a>

            <a th:href="@{/admin/torneos}"
               class="btn btn-primary">
                Torneos
            </a>

        </div>

        <span class="home-ball" aria-hidden="true">⚽</span>

    </section>

    <section class="card home-upcoming mt-20">

        <h2>Próximamente</h2>

        <ul class="home-feature-list">
            <li>Listar eventos de los jugadores en un torneo</li>
            <li>Listar eventos de los jugadores historico</li>
        </ul>

    </section>

</main>

</body>

</html>
