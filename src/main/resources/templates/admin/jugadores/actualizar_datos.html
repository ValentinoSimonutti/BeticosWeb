<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar jugador</title>
</head>
<body>

<h1>Actualizar jugador</h1>

<h2>Datos actuales</h2>

<p>
    <strong>ID:</strong>
    <span th:text="${jugador.id}"></span>
</p>

<p>
    <strong>Nombre actual:</strong>
    <span th:text="${jugador.nombreCompleto}"></span>
</p>

<p>
    <strong>Descripcion actual:</strong>
    <span th:text="${jugador.descripcion}"></span>
</p>

<p>
    <strong>Posicion actual:</strong>
    <span th:text="${jugador.posicion}"></span>
</p>

<p>
    <strong>Activo:</strong>
    <span th:text="${jugador.activo}"></span>
</p>

<hr>

<h2>Editar datos</h2>

<form th:action="@{/admin/jugadores/{id}/editar(id=${jugador.id})}"
      th:object="${jugador}"
      method="post"
      onsubmit="return confirm('¿Seguro que querés actualizar los datos de este jugador?');">

    <label for="nombreCompleto">Nuevo nombre completo:</label>
    <input type="text"
           id="nombreCompleto"
           th:field="*{nombreCompleto}"
           required>

    <br><br>

    <label for="descripcion">Nueva descripcion:</label>
    <textarea id="descripcion"
              th:field="*{descripcion}"></textarea>

    <br><br>

    <label for="posicion">Nueva posicion:</label>
    <select id="posicion"
            th:field="*{posicion}"
            required>
        <option value="">Seleccionar posicion</option>
        <option th:each="posicion : ${T(com.beticos.futbolapp.model.enums.PosicionJugador).values()}"
                th:value="${posicion}"
                th:text="${posicion}">
        </option>
    </select>

    <br><br>

    <button type="submit">Guardar cambios</button>
</form>

<br>

<a href="/admin/jugadores">Volver al listado</a>

</body>
</html>
