<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo jugador</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Crear jugador</h1>

        <form th:action="@{/admin/jugadores}"
              th:object="${jugador}"
              method="post">

            <div class="form-group">

                <label for="nombreCompleto">
                    Nombre completo
                </label>

                <input
                        id="nombreCompleto"
                        type="text"
                        th:field="*{nombreCompleto}"
                        required>

            </div>

            <div class="form-group">

                <label for="descripcion">
                    Descripción
                </label>

                <textarea
                        id="descripcion"
                        th:field="*{descripcion}"></textarea>

            </div>

            <div class="form-group">

                <label for="posicion">
                    Posición
                </label>

                <select
                        id="posicion"
                        th:field="*{posicion}"
                        required>
                    <option value="">Seleccionar posición</option>
                    <option th:each="posicion : ${T(com.beticos.futbolapp.model.enums.PosicionJugador).values()}"
                            th:value="${posicion}"
                            th:text="${posicion}">
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label for="equipoId">
                    Equipo
                </label>

                <select
                        id="equipoId"
                        name="equipoId"
                        required>
                    <option value="">Seleccionar equipo</option>
                    <option th:each="equipo : ${equipos}"
                            th:value="${equipo.id}"
                            th:text="${equipo.nombre}">
                    </option>
                </select>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/admin/jugadores}"
                   class="btn btn-warning">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
