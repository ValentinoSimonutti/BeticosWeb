<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Editar resultado</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Editar resultado</h1>

        <h2>
            <span th:text="${partido.equipoLocal.nombre}"></span>
            vs
            <span th:text="${partido.equipoVisitante.nombre}"></span>
        </h2>

        <p>
            <strong>Fecha:</strong>
            <span th:text="${fecha.numero}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <form th:action="@{/admin/fechas/{fechaId}/partidos/{partidoId}/editar(fechaId=${fecha.id}, partidoId=${partido.id})}"
              method="post">

            <div class="form-group">

                <label for="golesLocal">
                    Goles local
                </label>

                <input
                        id="golesLocal"
                        type="number"
                        min="0"
                        name="golesLocal"
                        th:value="${partido.golesLocal}"
                        th:readonly="${partido.golesLocal != null and partido.golesVisitante != null}"
                        required>

            </div>

            <div class="form-group">

                <label for="golesVisitante">
                    Goles visitante
                </label>

                <input
                        id="golesVisitante"
                        type="number"
                        min="0"
                        name="golesVisitante"
                        th:value="${partido.golesVisitante}"
                        th:readonly="${partido.golesLocal != null and partido.golesVisitante != null}"
                        required>

            </div>

            <h2>Eventos del partido</h2>

            <table>
                <thead>
                <tr>
                    <th>Jugador</th>
                    <th>Evento</th>
                </tr>
                </thead>

                <tbody id="eventos-partido">
                <tr th:each="evento : ${eventosPartido}">
                    <td>
                        <select name="eventoJugadorId">
                            <option value="">Sin evento</option>
                            <option th:each="jugador : ${jugadores}"
                                    th:value="${jugador.id}"
                                    th:text="${jugador.nombreCompleto}"
                                    th:selected="${evento.jugador.id == jugador.id}">
                            </option>
                        </select>
                    </td>

                    <td>
                        <select name="eventoTipo">
                            <option value="">Sin evento</option>
                            <option th:each="tipoEvento : ${tiposEvento}"
                                    th:value="${tipoEvento}"
                                    th:text="${tipoEvento}"
                                    th:selected="${evento.tipo == tipoEvento}">
                            </option>
                        </select>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(eventosPartido)}">
                    <td>
                        <select name="eventoJugadorId">
                            <option value="">Sin evento</option>
                            <option th:each="jugador : ${jugadores}"
                                    th:value="${jugador.id}"
                                    th:text="${jugador.nombreCompleto}">
                            </option>
                        </select>
                    </td>

                    <td>
                        <select name="eventoTipo">
                            <option value="">Sin evento</option>
                            <option th:each="tipoEvento : ${tiposEvento}"
                                    th:value="${tipoEvento}"
                                    th:text="${tipoEvento}">
                            </option>
                        </select>
                    </td>
                </tr>
                </tbody>
            </table>

            <template id="evento-template">
                <tr>
                    <td>
                        <select name="eventoJugadorId">
                            <option value="">Sin evento</option>
                            <option th:each="jugador : ${jugadores}"
                                    th:value="${jugador.id}"
                                    th:text="${jugador.nombreCompleto}">
                            </option>
                        </select>
                    </td>

                    <td>
                        <select name="eventoTipo">
                            <option value="">Sin evento</option>
                            <option th:each="tipoEvento : ${tiposEvento}"
                                    th:value="${tipoEvento}"
                                    th:text="${tipoEvento}">
                            </option>
                        </select>
                    </td>
                </tr>
            </template>

            <div class="actions mt-20">

                <button
                        type="button"
                        class="btn btn-info btn-small"
                        onclick="agregarEvento()">
                    Agregar evento
                </button>

                <button
                        type="button"
                        class="btn btn-danger btn-small"
                        onclick="eliminarEvento()">
                    Eliminar evento
                </button>

            </div>

            <div class="actions mt-20">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar resultado
                </button>

                <a th:href="@{/admin/fechas/{id}/partidos(id=${fecha.id})}"
                   class="btn btn-secondary">
                    Volver a partidos
                </a>

            </div>

        </form>

    </div>

</div>

<script>
    function agregarEvento() {
        const template = document.getElementById('evento-template');
        const tabla = document.getElementById('eventos-partido');

        tabla.appendChild(template.content.cloneNode(true));
    }

    function eliminarEvento() {
        const tabla = document.getElementById('eventos-partido');
        const filas = tabla.querySelectorAll('tr');

        if (filas.length > 1) {
            filas[filas.length - 1].remove();
            return;
        }

        filas[0].querySelectorAll('select').forEach(select => {
            select.value = '';
        });
    }
</script>

</body>

</html>
