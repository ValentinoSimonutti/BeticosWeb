<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Editar resultado</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Editar resultado</h1>

        <h2>
            <span th:text="${partido.equipoLocal.nombre}"></span>
            vs
            <span th:text="${partido.equipoVisitante.nombre}"></span>
        </h2>

        <p>
            <strong>Fecha:</strong>
            <span th:text="${fecha.numero}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <form th:action="@{/admin/fechas/{fechaId}/partidos/{partidoId}/editar(fechaId=${fecha.id}, partidoId=${partido.id})}"
              method="post">

            <div class="form-group">

                <label for="golesLocal">
                    Goles local
                </label>

                <input
                        id="golesLocal"
                        type="number"
                        min="0"
                        name="golesLocal"
                        th:value="${partido.golesLocal}"
                        required>

            </div>

            <div class="form-group">

                <label for="golesVisitante">
                    Goles visitante
                </label>

                <input
                        id="golesVisitante"
                        type="number"
                        min="0"
                        name="golesVisitante"
                        th:value="${partido.golesVisitante}"
                        required>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar resultado
                </button>

                <a th:href="@{/admin/fechas/{id}/partidos(id=${fecha.id})}"
                   class="btn btn-warning">
                    Volver a partidos
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
