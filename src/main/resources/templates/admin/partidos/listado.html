<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Partidos de la fecha</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Partidos - Fecha
            <span th:text="${fecha.numero}"></span>
        </h1>

        <p>
            <strong>Torneo:</strong>
            <span th:text="${fecha.torneo.nombre}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <h2>Agregar partido</h2>

        <form th:action="@{/admin/fechas/{id}/partidos(id=${fecha.id})}"
              method="post">

            <div class="form-group">

                <label for="equipoLocalId">
                    Equipo local
                </label>

                <select
                        id="equipoLocalId"
                        name="equipoLocalId"
                        required>
                    <option value="">Seleccione equipo</option>
                    <option th:each="inscripcion : ${equiposTorneo}"
                            th:value="${inscripcion.equipo.id}"
                            th:text="${inscripcion.equipo.nombre}">
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label for="equipoVisitanteId">
                    Equipo visitante
                </label>

                <select
                        id="equipoVisitanteId"
                        name="equipoVisitanteId"
                        required>
                    <option value="">Seleccione equipo</option>
                    <option th:each="inscripcion : ${equiposTorneo}"
                            th:value="${inscripcion.equipo.id}"
                            th:text="${inscripcion.equipo.nombre}">
                    </option>
                </select>

            </div>

            <div class="form-group">

                <label for="cancha">
                    Cancha
                </label>

                <input
                        id="cancha"
                        type="number"
                        name="cancha"
                        required>

            </div>

            <div class="form-group">

                <label for="golesLocal">
                    Goles local (opcional)
                </label>

                <input
                        id="golesLocal"
                        type="number"
                        name="golesLocal">

            </div>

            <div class="form-group">

                <label for="golesVisitante">
                    Goles visitante (opcional)
                </label>

                <input
                        id="golesVisitante"
                        type="number"
                        name="golesVisitante">

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar partido
                </button>

            </div>

        </form>

    </div>

    <div class="card mt-20">

        <h2>Partidos cargados</h2>

        <table>
            <thead>
            <tr>
                <th>Local</th>
                <th>Resultado</th>
                <th>Visitante</th>
                <th>Cancha</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:if="${#lists.isEmpty(partidos)}">
                <td colspan="5" class="text-center">
                    No hay partidos cargados.
                </td>
            </tr>

            <tr th:each="partido : ${partidos}">
                <td th:text="${partido.equipoLocal.nombre}"></td>
                <td>
                    <span th:if="${partido.golesLocal != null and partido.golesVisitante != null}"
                          th:text="${partido.golesLocal + ' - ' + partido.golesVisitante}">
                    </span>

                    <span th:unless="${partido.golesLocal != null and partido.golesVisitante != null}">
                        Pendiente
                    </span>
                </td>
                <td th:text="${partido.equipoVisitante.nombre}"></td>
                <td th:text="${partido.cancha}"></td>
                <td class="actions">
                    <a th:href="@{/admin/fechas/{fechaId}/partidos/{partidoId}/editar(fechaId=${fecha.id}, partidoId=${partido.id})}"
                       class="btn btn-warning">
                        Resultado
                    </a>

                    <form th:action="@{/admin/fechas/{fechaId}/partidos/{partidoId}/borrar(fechaId=${fecha.id}, partidoId=${partido.id})}"
                          method="post"
                          onsubmit="return confirm('Seguro que querés borrar este partido?');">
                        <button
                                type="submit"
                                class="btn btn-danger">
                            Borrar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="actions mt-20">
            <a th:href="@{/admin/torneos/{id}/fechas(id=${fecha.torneo.id})}"
               class="btn btn-warning">
                Volver a fechas
            </a>
        </div>

    </div>

</div>

</body>

</html>
