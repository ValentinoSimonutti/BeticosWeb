<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Actualizar torneo</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Actualizar torneo</h1>

        <h2>Datos actuales</h2>

        <p>
            <strong>ID:</strong>
            <span th:text="${torneo.id}"></span>
        </p>

        <p>
            <strong>Nombre actual:</strong>
            <span th:text="${torneo.nombre}"></span>
        </p>

        <p>
            <strong>Fecha inicio actual:</strong>
            <span th:text="${torneo.fechaInicio}"></span>
        </p>

        <p>
            <strong>Fecha fin actual:</strong>
            <span th:text="${torneo.fechaFin}"></span>
        </p>

        <p>
            <strong>Estado actual:</strong>
            <span th:text="${torneo.estado}"></span>
        </p>

    </div>

    <div class="card mt-20">

        <h2>Editar datos</h2>

        <form th:action="@{/admin/torneos/{id}/editar(id=${torneo.id})}"
              th:object="${torneo}"
              method="post"
              onsubmit="return confirm('¿Seguro que querés actualizar los datos de este torneo?');">

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                        id="nombre"
                        type="text"
                        th:field="*{nombre}"
                        required>

            </div>

            <div class="form-group">

                <label for="fechaInicio">
                    Fecha inicio
                </label>

                <input
                        id="fechaInicio"
                        type="date"
                        th:field="*{fechaInicio}">

            </div>

            <div class="form-group">

                <label for="fechaFin">
                    Fecha fin
                </label>

                <input
                        id="fechaFin"
                        type="date"
                        th:field="*{fechaFin}">

            </div>

            <div class="form-group">

                <label for="estado">
                    Estado
                </label>

                <select
                        id="estado"
                        th:field="*{estado}"
                        required>
                    <option th:each="estado : ${estados}"
                            th:value="${estado}"
                            th:text="${estado}">
                    </option>
                </select>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar cambios
                </button>

                <a th:href="@{/admin/torneos}"
                   class="btn btn-warning">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
