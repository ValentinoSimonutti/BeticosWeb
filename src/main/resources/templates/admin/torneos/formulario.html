<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo torneo</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Crear torneo</h1>

        <form th:action="@{/admin/torneos}"
              th:object="${torneo}"
              method="post">

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                        id="nombre"
                        type="text"
                        th:field="*{nombre}"
                        required>

            </div>

            <div class="form-group">

                <label for="fechaInicio">
                    Fecha inicio
                </label>

                <input
                        id="fechaInicio"
                        type="date"
                        th:field="*{fechaInicio}">

            </div>

            <div class="form-group">

                <label for="fechaFin">
                    Fecha fin
                </label>

                <input
                        id="fechaFin"
                        type="date"
                        th:field="*{fechaFin}">

            </div>

            <div class="form-group">

                <label for="estado">
                    Estado
                </label>

                <select
                        id="estado"
                        th:field="*{estado}"
                        required>
                    <option value="">Seleccionar estado</option>
                    <option th:each="estado : ${estados}"
                            th:value="${estado}"
                            th:text="${estado}">
                    </option>
                </select>

            </div>

            <div class="actions">

                <button
                        type="submit"
                        class="btn btn-primary">
                    Guardar
                </button>

                <a th:href="@{/admin/torneos}"
                   class="btn btn-secondary">
                    Volver al listado
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
