<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Torneos</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">

</head>

<body>

<div th:replace="~{admin/fragments/header :: header}"></div>

<div class="container">

    <div class="card">

        <h1>Torneos</h1>

        <a th:href="@{/admin/torneos/nuevo}"
           class="btn btn-primary">
            Crear nuevo torneo
        </a>

    </div>

    <div class="card mt-20">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fecha inicio</th>
                <th>Fecha fin</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="torneo : ${torneos}">
                <td th:text="${torneo.id}"></td>
                <td th:text="${torneo.nombre}"></td>
                <td th:text="${torneo.fechaInicio}"></td>
                <td th:text="${torneo.fechaFin}"></td>
                <td th:text="${torneo.estado}"></td>
                <td class="actions">
                    <a th:href="@{/admin/torneos/{id}/fechas(id=${torneo.id})}"
                       class="btn btn-primary">
                        Fechas
                    </a>

                    <a th:href="@{/admin/torneos/{id}/equipos(id=${torneo.id})}"
                       class="btn btn-primary">
                        Equipos
                    </a>

                    <a th:href="@{/admin/torneos/{id}/jugadores(id=${torneo.id})}"
                       class="btn btn-primary">
                        Jugadores
                    </a>

                    <a th:href="@{/admin/torneos/{id}/editar(id=${torneo.id})}"
                       class="btn btn-warning">
                        Editar
                    </a>

                    <form th:action="@{/admin/torneos/{id}/borrar(id=${torneo.id})}"
                          method="post"
                          onsubmit="return confirm('¿Seguro que querés borrar este torneo?');">
                        <button
                                type="submit"
                                class="btn btn-danger">
                            Borrar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="actions mt-20">
            <a th:href="@{/admin/home}"
               class="btn btn-secondary">
                Volver al inicio
            </a>
        </div>

    </div>

</div>

<div th:replace="~{admin/fragments/footer :: footer}"></div>

</body>

</html>
